<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product list with cart</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>


    <h2 class="w-100 container mb-0">Desserts</h2>
    <div class="container d-flex flex-column flex-lg-row align-items-start mt-4">
        <div id="rowData" class="items position-relative gap-5 row m-0 ">
        </div>
        <div class="cart bg-body w-100 p-3 mt-4 mt-lg-0">
            <h5>Your Cart (<span id="item-count">0</span>)</h5>
            <div class="empty d-flex flex-column">
                <img class=" w-50 align-self-center" src="./images/illustration-empty-cart.svg" alt="illustration">
                <p class="text-center">Your added items will appear here</p>
            </div>
            <div class="order d-none">
                <div id="rowData2" class="full-order d-flex flex-wrap flex-column">

                </div>
                <div class="total-price d-flex justify-content-between">
                    <p>Order Total</p>
                    <p>$<span id="item-total-price"></span></p>
                </div>
                <div class="natural d-flex justify-content-center align-items-center rounded-1 p-2">
                    <div class="icon">
                        <img src="./images/icon-carbon-neutral.svg" alt="carbon">
                    </div>
                    <p class="mb-0">This is a <span>carbon-neutral</span> delivary</p>
                </div>
                <button class="confirm-order btn btn-danger rounded-pill w-100 mt-3">Confirm Order</button>
            </div>
        </div>
    </div>

    <div class="final-order position-fixed p-5 top-0 bottom-0 start-0 end-0 d-flex align-items-center justify-content-center d-none">
        <div class="order-details bg-body p-5 rounded-3">
            <div class="title">
                <img src="./images/icon-order-confirmed.svg" alt="confirmed">
                <div class="caption mt-3">
                    <h3 class="fw-bold">Order Confirmed</h3>
                    <p class="text-secondary">we hope you enjoy your food</p>
                </div>
            </div>
            <div id="rowData3" class="order-items d-flex flex-column">

            </div>
            
                <div class="final-price d-flex justify-content-between">
                    <p>Total Price</p>
                    <p>$<span id="total-price"></span></p>
                </div>
                <button class="restart-order-button btn btn-danger rounded-pill mt-3 w-100">Start new order</button>
            </div>
        </div>
    </div>



    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
